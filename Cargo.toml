[package]
name = "aivyx-confine"
description = "OS-level process confinement (Landlock + seccomp-bpf) for spawned command execution"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
globset = "0.4.18"
landlock = { version = "0.4.5", optional = true }
libc = { version = "0.2.186", optional = true }
seccompiler = { version = "0.5.0", optional = true }
tokio = { version = "1.52.3", features = ["process"] }
tracing = "0.1.44"

[features]
default = ["sandbox-backend"]
# Real OS-level confinement (Landlock filesystem scoping + a seccomp-bpf
# syscall denylist). Opt out with `--no-default-features` on
# platforms/kernels where it isn't available — `NoopConfiner` remains the
# fallback.
sandbox-backend = ["dep:landlock", "dep:libc", "dep:seccompiler"]

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt"] }

[package]
name = "aivyx-confine"
description = "OS-level process confinement (Landlock + seccomp-bpf) for spawned command execution"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"
publish = false

[dependencies]
globset = "0.4.18"
tokio = { version = "1.52.3", features = ["process"] }
tracing = "0.1.44"

# The backend is Linux-only (Landlock, seccomp-bpf). Elsewhere these aren't
# built and `sandbox-backend` compiles to the NoopConfiner build, so a
# product can keep the feature on for every target (one feature set for a
# multi-platform release) and still build on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "0.4.5", optional = true }
libc = { version = "0.2.186", optional = true }
seccompiler = { version = "0.5.0", optional = true }
tempfile = { version = "3.27.0", optional = true }

[features]
default = ["sandbox-backend"]
# Real OS-level confinement (Landlock filesystem scoping + a seccomp-bpf
# syscall denylist) on Linux. On other platforms it has no effect: the
# build is the same as without it (`NoopConfiner`). Opt out with
# `--no-default-features` on Linux kernels where it isn't available.
sandbox-backend = ["dep:landlock", "dep:libc", "dep:seccompiler", "dep:tempfile"]

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt", "io-util", "time"] }
